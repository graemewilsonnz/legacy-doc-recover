[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-doc-recover"
version = "0.1.0"
description = "Best-effort text recovery from damaged Microsoft Word 97-2003 binary .doc files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "0BSD"}
authors = [
  {name = "legacy-doc-recover contributors"}
]
keywords = ["doc", "word", "recovery", "ole", "cfb", "forensics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
legacy-doc-recover = "legacy_doc_recover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
